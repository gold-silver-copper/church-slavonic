[workspace]
members = [
    "crates/church-slavonic-core",
    "crates/old-church-slavonic-core",
    "crates/old-church-slavonic",
    "crates/old-church-slavonic-dictionary",
    "crates/old-church-slavonic-extractor",
    "crates/synodal-church-slavonic-core",
    "crates/synodal-church-slavonic",
    "crates/synodal-church-slavonic-dictionary",
    "crates/synodal-church-slavonic-extractor",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
authors = ["gold-silver-copper"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/church-slavonic"
rust-version = "1.85"

[workspace.dependencies]
church-slavonic-core = { path = "crates/church-slavonic-core", version = "0.1.0" }
old-church-slavonic = { path = "crates/old-church-slavonic", version = "0.5.0" }
old-church-slavonic-core = { path = "crates/old-church-slavonic-core", version = "0.4.0" }
old-church-slavonic-dictionary = { path = "crates/old-church-slavonic-dictionary", version = "0.2.0" }
old-church-slavonic-extractor = { path = "crates/old-church-slavonic-extractor", version = "0.1.0" }
synodal-church-slavonic = { path = "crates/synodal-church-slavonic", version = "0.4.0" }
synodal-church-slavonic-core = { path = "crates/synodal-church-slavonic-core", version = "0.4.0" }
synodal-church-slavonic-dictionary = { path = "crates/synodal-church-slavonic-dictionary", version = "0.4.0" }
synodal-church-slavonic-extractor = { path = "crates/synodal-church-slavonic-extractor", version = "0.1.0" }
quick-xml = "0.37.5"
calamine = "0.28.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
toml = "0.8.23"
unicode-normalization = "0.1.24"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev.package.sha2]
opt-level = 3

# The dictionary's exhaustive morphology checks are CPU-bound. Optimizing test
# code preserves debug assertions and overflow checks while keeping the full
# correctness inventory practical on local and CI runners.
[profile.test]
opt-level = 1
