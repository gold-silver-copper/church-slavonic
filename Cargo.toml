[workspace]
members = [
    "crates/old-church-slavonic-core",
    "crates/old-church-slavonic",
    "crates/old-church-slavonic-dictionary",
    "crates/old-church-slavonic-extractor",
    "crates/xtask",
]
resolver = "3"

[workspace.package]
authors = ["gold-silver-copper"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/church-slavonic"
rust-version = "1.85"

[workspace.dependencies]
old-church-slavonic = { path = "crates/old-church-slavonic", version = "0.3.0" }
old-church-slavonic-core = { path = "crates/old-church-slavonic-core", version = "0.3.0" }
old-church-slavonic-dictionary = { path = "crates/old-church-slavonic-dictionary", version = "0.1.0" }
old-church-slavonic-extractor = { path = "crates/old-church-slavonic-extractor", version = "0.1.0" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
unicode-normalization = "0.1.24"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
