[workspace]
members = [
    "crates/church-slavonic",
    "crates/church-slavonic-tools",
]
default-members = [
    "crates/church-slavonic",
    "crates/church-slavonic-tools",
]
resolver = "3"

[workspace.package]
authors = ["gold-silver-copper"]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gold-silver-copper/church-slavonic"
rust-version = "1.88"

[workspace.dependencies]
church-slavonic = { path = "crates/church-slavonic", version = "2.0.0-dev" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
unicode-normalization = "0.1.24"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.release]
opt-level = 2

# Optimize all dependencies even in debug builds: the extractor and the
# accuracy harness spend their time in unicode-normalization and serde_json.
[profile.dev.package."*"]
opt-level = 2
