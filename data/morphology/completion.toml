rationale = "Determiner is modeled as lexical/syntactic ownership over attested declensional systems rather than as invented terminals. The typed inventory unifies eight already reviewed 2/p identities, Polivanova's unique кꙑи and long-only которꙑи, and the Paradigmatic Dictionary's 2/a classification of ѥтеръ; exact raw dictionary evidence remains separately accessible."

