required_metadata = ["complete single-word morphology output or unchanged Glagolitic input", "GlagoliticProfile::Jagic1879NormalizedOcs", "TransliterationLossPolicy::Reject or Report"]
valid_inventory = "Every letter in the productive OCS Cyrillic rule inventory, the complete shared Jagić alphabet in both cases, distinct ꙑ/ы sequences, unchanged already-Glagolitic input, the OCS palatalization mark and neutral combining marks, and explicit reported folds, expansions, or sequence collisions for Cyrillic-only distinctions."
invalid_inventory = "Implicit transliteration during lookup or inflection; mixed-script stem-plus-ending output; silent lossy folding; diplomatic manuscript recovery; abbreviations, superscripts, breathing and abbreviation marks, and later Croatian Glagolitic outside the normalized OCS profile."
