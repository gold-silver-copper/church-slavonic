citation = "UT OCS Online §44.1–10,000; Polivanova 2023 §§70, 72, 285, 287–299, 303–306, 314–316, 321–322, 345–351, 373–374, and 383–384 plus the OSD spreadsheet's ordinal, collective, and fractional-noun rows; Gorshkov 2002 §86 and §§115–119; Leuta and Havryliuk 2018 pp. 155 and 161–162; Krys'ko 2020 pp. 55–67 for low collective full-number grammar; ESSJa *-er-/*-or- collective series entries; Syntacticus/UD OCS PROIEL compound-ordinal, simple-ordinal, collective, and fractional cell crosschecks; Punco/UZH Reference Grammar numeral syntax overview"
required_metadata = ["stable lexical or grammatical identity", "numeral kind", "agreement/government pattern", "case", "licensed inherent number", "gender for agreeing simple cardinals, ordinals, and collectives", "noun class and lexical gender for fractional nouns", "pronominal or adjectival cell class for collectives", "short or long form and animacy for ordinals and adjectival collectives", "component identities and construction type for compounds"]
valid_inventory = "Twelve reviewed simple-cardinal identities cover a two-form lexical doublet for one, two, both, three, four, and five through ten. Each exposes all 84 case × number × optional-gender requests: one agrees only in the singular, two/both only in the dual, three/four only in the plural, five through nine decline substantivally in the singular and govern genitive plural, and mixed-declension ten exposes all three numbers without gender. Source-listed ten variants precede explicitly productive i-stem analogues. Four typed magnitude identities cover съто, both nasal-vowel spellings of тꙑсѫщи/тꙑсѧщи with compact Polivanova and expanded UT variants, and тъма over complete noun-like case-number inventories. Every integer 11–10,000 has a structured multiword realization: teens inflect their unit before invariant на десѧте; 20–40 inflect both components and preserve correlated 30/40 alternatives; 50–90 inflect the multiplier before invariant genitive-plural десѧтъ; hundreds and thousands use the source-defined one/two/three-four/five-nine construction split; 10,000 preserves both десѧть тꙑсѧшть-type and тъма analyses; and nonzero decimal chunks are joined by и. The lowest nonzero component determines whole-expression agreement or government. Ten reviewed simple-ordinal identities are the exact class-2/a OSD inventory прьвъ through десѧтъ. Nine use the ordinary hard adjective kernel; третии uses its source-listed трет.ьj workstem and the §72 boundary rules. Every ordinal exposes all 252 short/long × case × number × gender × animacy cells. Every integer 11–1,000 also exposes 252 structured compound-ordinal cells: teens preserve analytic unit + на десѧте and reviewed fused alternatives; exact decades, hundreds, and thousand use source-listed hard-adjective heads plus explicitly reconstructed gaps; additive values retain agreeing adjective tokens joined by и, ти, or no connector. Source-listed stems, productive cells, reconstructed 14th/60th/700th–900th alternatives, and exact Suprasliensis spellings remain distinguishable per token. The complete inherited collective series has ten stable identities: дъвои, обои, and трои reuse all 63 class-2/p case × number × gender requests and retain nine typed vocative failures; four through ten use the full 252-cell hard short/long adjective space. Direct OCS collective citations are distinguished from productive cells and historically reconstructed parallel -ер-/-ор- stems. Reconstructed five, six, and nine are never mislabeled as attestations, and the corpus spelling десꙙторо remains cell-specific. Derived -ица group nouns remain noun lexemes rather than being conflated with numeral agreement. The period-bounded fractional inventory contains four substantival identities: u-stem полъ and a-stem половина for one half, i-stem четврьть for one quarter, and a-stem десѧтина for one tenth. Each exposes all 21 noun cells; source-listed citations, productive inherited-declension cells, and exact fractional/tithe corpus uses remain distinct analyses. Source citations and cell-specific PROIEL spellings are distinguished from productive standard synthesis, including grammatically licensed but unattested forms. Every component retains its own FormSet evidence, and both lexical forms of one, thousand, and half are selectable. Exact dictionary numeral types outside this inventory remain available as raw or fallback evidence."
invalid_inventory = "Wrong inherent number for agreeing one through four; absent gender on an agreeing simple or final compound unit; gender on substantival/governing cardinals and magnitude heads; non-singular five through nine; vocatives absent from the unique two/three/four cardinal component tables; malformed orthography; ordinal lemmas outside the reviewed ten-identity source union; an adjectival cell supplied to a pronominal collective or a pronominal cell supplied to an adjectival collective; later Church Slavonic fractional identities such as третина, полътора, and полътретиꙗ in the OCS fractional API; composed cardinal values outside 11–10,000; compound ordinal values outside the implemented base range 11–1,000; a non-one identity selected as the compound one doublet; a non-thousand magnitude selected as the compound thousand doublet; and untyped remaining derived numerals."
implementation = ["crates/old-church-slavonic-core/src/grammar.rs", "crates/old-church-slavonic-core/src/numeral.rs", "crates/old-church-slavonic-core/src/pronoun.rs", "crates/old-church-slavonic-core/src/noun.rs", "crates/old-church-slavonic-core/src/adjective.rs", "crates/old-church-slavonic/src/resolver.rs", "crates/old-church-slavonic/src/paradigm.rs"]
tests = ["crates/old-church-slavonic-core/src/numeral.rs#simple_cardinal_inventory_is_exhaustive_and_nonoverlapping", "crates/old-church-slavonic-core/src/numeral.rs#simple_ordinal_inventory_is_exhaustive_and_nonoverlapping", "crates/old-church-slavonic-core/src/numeral.rs#every_simple_ordinal_licenses_all_adjective_cells", "crates/old-church-slavonic-core/src/numeral.rs#hard_ordinals_reuse_the_adjective_profile_exactly", "crates/old-church-slavonic-core/src/numeral.rs#third_ordinal_uses_the_reviewed_yer_j_profile", "crates/old-church-slavonic-core/src/numeral.rs#third_ordinal_retains_cell_specific_proiel_spellings", "crates/old-church-slavonic-core/src/numeral.rs#compound_ordinal_heads_cover_every_agreement_cell_with_typed_evidence", "crates/old-church-slavonic-core/src/numeral.rs#compound_ordinal_heads_keep_cell_specific_manuscript_spellings", "crates/old-church-slavonic-core/src/numeral.rs#collective_inventory_is_complete_nonoverlapping_and_typed", "crates/old-church-slavonic-core/src/numeral.rs#collective_pronominals_reuse_every_reviewed_class_2_p_cell", "crates/old-church-slavonic-core/src/numeral.rs#higher_collectives_cover_every_adjective_cell_and_both_inherited_stems", "crates/old-church-slavonic-core/src/numeral.rs#collective_cell_classes_fail_closed_when_crossed", "crates/old-church-slavonic-core/src/numeral.rs#collective_goldens_distinguish_direct_reconstructed_and_corpus_forms", "crates/old-church-slavonic-core/src/numeral.rs#fractional_inventory_is_closed_nonoverlapping_and_period_bounded", "crates/old-church-slavonic-core/src/numeral.rs#fractional_nouns_reuse_every_inherited_declension_cell", "crates/old-church-slavonic-core/src/numeral.rs#fractional_goldens_keep_source_classes_and_exact_corpus_evidence", "crates/old-church-slavonic-core/src/adjective.rs#yer_j_workstem_reproduces_the_reviewed_direct_profile", "crates/old-church-slavonic-core/src/adjective.rs#yer_j_workstem_remains_productive_in_long_cells", "crates/old-church-slavonic-core/src/numeral.rs#magnitude_inventory_is_exhaustive_nonoverlapping_and_ungendered", "crates/old-church-slavonic-core/src/numeral.rs#magnitude_goldens_cover_hundred_thousand_and_myriad_profiles", "crates/old-church-slavonic-core/src/numeral.rs#one_through_nine_enforce_real_agreement_and_government_shapes", "crates/old-church-slavonic-core/src/numeral.rs#source_goldens_cover_each_simple_cardinal_profile", "crates/old-church-slavonic-core/src/numeral.rs#ten_preserves_mixed_attested_and_productive_variants", "crates/old-church-slavonic-core/src/numeral.rs#counted_ten_preserves_the_attested_twenty_genitive", "crates/old-church-slavonic/tests/public_api.rs#simple_cardinals_have_exhaustive_typed_paradigms_and_evidence", "crates/old-church-slavonic/tests/public_api.rs#simple_ordinals_have_complete_adjective_paradigms_and_evidence", "crates/old-church-slavonic/tests/public_api.rs#compound_ordinals_through_one_thousand_are_structured_and_exhaustive", "crates/old-church-slavonic/tests/public_api.rs#collective_numerals_preserve_their_two_real_inflectional_classes", "crates/old-church-slavonic/tests/public_api.rs#fractional_numerals_are_complete_noun_paradigms_with_period_boundaries", "crates/old-church-slavonic/tests/public_api.rs#collective_numerals_reject_crossed_cell_classes", "crates/old-church-slavonic/tests/public_api.rs#reviewed_hard_ordinals_match_existing_adjective_tables", "crates/old-church-slavonic/tests/public_api.rs#compound_cardinals_through_ninety_nine_are_structured_and_exhaustive", "crates/old-church-slavonic/tests/public_api.rs#cardinal_magnitudes_and_composition_through_ten_thousand_are_structured", "crates/old-church-slavonic/tests/public_api.rs#every_integer_through_ten_thousand_has_a_well_formed_analysis"]
evidence_status = "source-reviewed cardinal grammar through 10,000, simple ordinals first through tenth, base compound ordinals 11–1,000, the inherited collective series two through ten, and the four-identity OCS fractional-noun inventory, with typed agreement/government, complete licensed declension products, correlated multiword analyses, direct/reconstructed/corpus variants, and explicit attested-versus-productive evidence; remaining derived numeral grammar incomplete"
gap = "Resolve the competing asyndetic component-declension account and rare 21–29 ordinal turns, extend ordinal magnitudes beyond 1,000 where licensed, and complete distributive and remaining irregular numeral inventories."

