tests = ["crates/old-church-slavonic-core/src/orthography.rs#normalized_jagic_core_is_reversible_and_complete_word_scoped", "crates/old-church-slavonic-core/src/orthography.rs#every_shared_jagic_letter_round_trips_in_both_cases", "crates/old-church-slavonic-core/src/orthography.rs#yeri_sequences_preserve_the_two_cyrillic_spellings", "crates/old-church-slavonic-core/src/orthography.rs#literal_yer_i_sequences_are_not_mislabeled_reversible", "crates/old-church-slavonic-core/src/orthography.rs#cyrillic_only_distinctions_are_reported_or_rejected", "crates/old-church-slavonic-core/src/orthography.rs#every_reviewed_cyrillic_fold_or_expansion_is_loss_reported", "crates/old-church-slavonic-core/src/orthography.rs#rare_glagolitic_collisions_are_never_silent", "crates/old-church-slavonic-core/src/orthography.rs#unicode_composites_and_source_allographs_have_explicit_fidelity", "crates/old-church-slavonic-core/src/orthography.rs#productive_cyrillic_inventory_has_no_silent_glagolitic_holes", "crates/old-church-slavonic-core/src/orthography.rs#neutral_and_palatalization_marks_are_preserved_but_diplomatic_marks_fail", "crates/old-church-slavonic-core/src/orthography.rs#late_or_mixed_script_input_never_falls_through", "crates/old-church-slavonic/tests/public_api.rs#source_backed_glagolitic_and_hostile_inputs_are_panic_free", "crates/old-church-slavonic/tests/public_api.rs#normalized_glagolitic_realization_composes_after_morphology_without_mixed_script"]
evidence_status = "The locked dictionary preserves 28 exact Glagolitic inflection rows for one Glagolitic lemma and keeps them ahead of presentation. Productive output uses Polivanova's normalized table crosschecked against TN41's classical Jagić table; every extension beyond the reversible shared alphabet is explicitly loss-reported and never labeled attested."
gap = ""
rationale = "Whole-word post-morphology realization makes every productive Cyrillic rule composable with a single-script Glagolitic result without inventing script-specific endings. Polivanova's normalization and the independent Jagić/TN41 crosscheck determine the shared alphabet and the iotated-vowel boundary. A typed loss policy preserves the distinction between reversible transliteration and historically necessary normalization, while exact dictionary spellings retain their own provenance."

