blic_api.rs#cardinal_magnitudes_and_composition_through_ten_thousand_are_structured", "crates/old-church-slavonic/tests/public_api.rs#every_integer_through_ten_thousand_has_a_well_formed_analysis", "crates/old-church-slavonic/tests/public_api.rs#distributive_cardinals_are_fixed_dative_structures_and_exhaustive"]
evidence_status = "source-reviewed complete OCS numeral morphology: cardinals and distributives through the source-defined exact 10,000 inventory, simple and compound ordinals through the independently specified thousandth boundary, both disputed asyndetic accounts and both rare 21–29 patterns, the inherited collective series, the four-identity fractional-noun inventory, and the indefinite-quantity noun несъвѣда, with typed agreement/government, complete licensed cell products, correlated multiword analyses, direct/reconstructed/disputed/corpus/primary-text variants, explicit attested-versus-productive evidence, and derived items routed to their owning parts of speech"
rationale = "Independent OCS grammar, dictionary, lexical-monograph, and manuscript lineages converge on the implemented simple, exact-magnitude, compound, collective, distributive, fractional, and indefinite-quantity contracts. Gorshkov's compressed equation of несъвѣда with 10,000 is resolved by Lvov's named oldest-manuscript evidence: exact тъма remains in integer composition, while indefinite несъвѣда receives its full inherited hard a-stem paradigm and exact instrumental-plural provenance. Simonov and Pronin independently show why later million-scale uses cannot supply a context-free exact value. The ordinal inventories stop at thousandth and do not jointly determine a higher multiplier stem or component-inflection rule; modern Russian higher ordinals are therefore recension contamination, not an OCS implementation gap. Suprun's historical category analysis assigns the remaining derived series to adjectives, nouns, or adverbs. All actual inflection remains available through those owning systems, and the closed irregular variants are explicitly represented here."

