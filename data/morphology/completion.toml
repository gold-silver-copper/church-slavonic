required_metadata = ["stable lexical or grammatical identity", "numeral kind", "agreement/government pattern where applicable", "case or fixed dative construction", "licensed inherent number", "gender for agreeing simple cardinals, ordinals, collectives, and distributives", "noun class and lexical gender for fractional and indefinite-quantity nouns", "pronominal or adjectival cell class for collectives", "short or long form and animacy for ordinals and adjectival collectives", "component identities and construction type for compounds"]
valid_inventory = "Twelve reviewed simple-cardinal identities cover a two-form lexical doublet for one, two, both, three, four, and five through ten. Each exposes all 84 case × number × optional-gender requests: one agrees only in the singular, two/both only in the dual, three/four only in the plural, five through nine decline substantivally in the singular and govern genitive plural, and mixed-declension ten exposes all three numbers without gender. Source-listed ten variants precede explicitly productive i-stem analogues. Four typed exact-magnitude identities cover съто, both nasal-vowel spellings of тꙑсѫщи/тꙑсѧщи with compact Polivanova and expanded UT variants, and тъма over complete noun-like case-number inventories. The distinct indefinite-quantity identity несъвѣда exposes all 21 hard feminine a-stem noun cells: nominative singular is source-listed, instrumental plural несъвѣдами has exact named-manuscript provenance, and the other cells are explicit productive predictions. It has no exact integer value and cannot enter cardinal composition. Every integer 11–10,000 has a structured multiword realization: teens inflect their unit before invariant на десѧте; 20–40 inflect both components and preserve correlated 30/40 alternatives; 50–90 inflect the multiplier before invariant genitive-plural десѧтъ; hundreds and thousands use the source-defined one/two/three-four/five-nine construction split; 10,000 preserves both десѧть тꙑсѧшть-type and тъма analyses; and nonzero decimal chunks are joined by и. The lowest nonzero component determines whole-expression agreement or government. Every cardinal 1–10,000 also has a structured distributive по + dative realization. The fixed-case cell accepts gender exactly for an agreeing final unit, retains cardinal government and lexical one/thousand choices, and keeps the preposition and each cardinal word independently evidenced; exact one-by-one, two-by-two, fifty-at-a-time, hundred-at-a-time, and composed-magnitude corpus witnesses license the construction, while unobserved values are productive predictions. This is analytic syntax, not a fifth synthetic numeral declension, and temporal по + locative remains excluded. Ten reviewed simple-ordinal identities are the exact class-2/a OSD inventory прьвъ through десѧтъ. Nine use the ordinary hard adjective kernel; третии uses its source-listed трет.ьj workstem and the §72 boundary rules. Every ordinal exposes all 252 short/long × case × number × gender × animacy cells. Every integer 11–1,000 also exposes 252 structured compound-ordinal cells: teens preserve analytic unit + на десѧте and reviewed fused alternatives; exact decades, hundreds, and thousand use source-listed hard-adjective heads plus explicitly reconstructed gaps; additive values retain agreeing adjective tokens joined by и or ти, a directly attested all-agreeing asyndetic analysis, and a separately tagged disputed asyndetic analysis in which only the first component declines. Values 21–29 additionally retain the source-licensed unit + междю десетма and unit + третиаго десѧте constructions across the full agreement product; their fixed tails have exact reviewed evidence while unattested unit cells remain productive. Source-listed stems, productive cells, reconstructed 14th/60th/700th–900th alternatives, competing source accounts, and exact Suprasliensis spellings remain distinguishable per token or construction tag. The complete inherited collective series has ten stable identities: дъвои, обои, and трои reuse all 63 class-2/p case × number × gender requests and retain nine typed vocative failures; four through ten use the full 252-cell hard short/long adjective space. Direct OCS collective citations are distinguished from productive cells and historically reconstructed parallel -ер-/-ор- stems. Reconstructed five, six, and nine are never mislabeled as attestations, and the corpus spelling десꙙторо remains cell-specific. Derived -ица group nouns remain noun lexemes rather than being conflated with numeral agreement. The period-bounded fractional inventory contains four substantival identities: u-stem полъ and a-stem половина for one half, i-stem четврьть for one quarter, and a-stem десѧтина for one tenth. Each exposes all 21 noun cells; source-listed citations, productive inherited-declension cells, and exact fractional/tithe corpus uses remain distinct analyses. Source citations, primary-text forms, and cell-specific PROIEL spellings are distinguished from productive standard synthesis, including grammatically licensed but unattested forms. Every component retains its own FormSet evidence, and both lexical forms of one, thousand, and half are selectable. The public ordinal range constants and `NUM-SCOPE-BOUNDARY-01` encode the independently corroborated stop at thousandth; higher OCS stem shape and component inflection are not determined by the source union. Fractional and indefinite-quantity identities remain numeral-owned APIs over inherited noun kernels; other number-related `-ица` group nouns, `двоякий`-type adjectives, and `дважды`/`сам-третей`-type adverbs are routed to noun, adjective, or invariant-adverb ownership rather than treated as missing numeral declensions. The reviewed one doublet, mixed ten paradigm, exact-magnitude spellings, myriad analyses, indefinite quantity, collective stems, fractional identities, fused heads, and disputed constructions exhaust the source-defined irregular inventory."
invalid_inventory = "Wrong inherent number for agreeing one through four; absent gender on an agreeing simple, final compound, or distributive unit; gender on substantival/governing cardinals, governing distributives, and magnitude heads; non-singular five through nine; vocatives absent from the unique two/three/four cardinal component tables; malformed orthography; ordinal lemmas outside the reviewed ten-identity source union; an adjectival cell supplied to a pronominal collective or a pronominal cell supplied to an adjectival collective; later Church Slavonic fractional identities such as третина, полътора, and полътретиꙗ in the OCS fractional API; treating indefinite несъвѣда as an exact magnitude or admitting it to integer composition; composed cardinal values outside 11–10,000; distributive values outside 1–10,000 or a caller-selectable non-dative case; compound ordinal values below 11, which belong to the simple API, or above the source-determined maximum 1,000; a rare 21–29 construction outside that exact value interval; a non-one identity selected as the compound or distributive one doublet; a non-thousand magnitude selected as the compound or distributive thousand doublet; later-recension higher ordinal morphology; and numeral-related derivations submitted to the wrong part-of-speech API."
implementation = ["crates/old-church-slavonic-core/src/grammar.rs", "crates/old-church-slavonic-core/src/numeral.rs", "crates/old-church-slavonic-core/src/pronoun.rs", "crates/old-church-slavonic-core/src/noun.rs", "crates/old-church-slavonic-core/src/adjective.rs", "crates/old-church-slavonic/src/resolver.rs", "crates/old-church-slavonic/src/paradigm.rs"]
