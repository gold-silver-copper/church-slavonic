impact = "Adds a completeness-oriented independent grammar and grammatical dictionaries; §§16–21, 131–133, and 866 independently define the canonical/natural/secondary alphabets, reversible Glagolitic core, palatalization mark, allograph folds, iotated-vowel boundary, and manuscript exclusions used by the explicit script profile. §§267, 285–302, and 326–351 plus the OSD spreadsheet close all five standard substantive classes: 2,423 row-addressed profiles, 2,417 citation spellings, and the exact 24-member regular pluralia-tantum inventory. §§285 and 303–305 define the exhaustive long-only adjective inventory, while §§287–320, 375–380, and Paradigmatic Dictionary entry 343 define the regular, exceptional, and adjectival profiles allocated to the determiner and pronoun facades. §§70, 72, 285, 299, and 303–306 plus the OSD spreadsheet define the exact ten-member simple-ordinal lexicon, its nine hard profiles, the трет.ьj boundary, and productive short/long agreement. The OSD also directly allocates дъвои, обои, and трои to j-pronominal class 2/p and четворъ, седморъ, and десѧторъ to hard adjectival class 2/a, establishing both inflectional halves of the collective system, and independently lists the fractional noun lexemes полъ and десѧтина. §§321–322, 345–351, 373–374, and 383–384 independently define the unique three/four tables, both thousand identities over the productive feminine ja-stem profile, the feminine i-stem background of five through nine, and the attested mixed paradigm and variants of ten. §§318 and 381–382 define the four intrinsic personal/reflexive/anaphoric identities, their defective dimensions, grammar-table clitics, and conditioned prepositional allomorphs. Its comparative chapters establish the two principal parts, three syncopated cell families, four alien endings, productive new formation, and closed old inventory. Its aorist inventory established the independent main/singular subbundles and the distinct standard vowel, old s-, and old x-sigmatic contracts. Its imperfect terminal table and manuscript discussion establish explicit uncontracted, contracted, iotated, and present-platform analyses without treating source frequency as a global default. §§407, 483, and 865 place verbal nouns outside the verb paradigm but define their source-bounded nominal derivation from participial or independent verbal platforms; §276 n.4 proves that an engine input cannot require an actually attested participle. Its unique-verb profiles independently establish the suppletive copular series and the complete имѣти/хотѣти auxiliary paradigms used by analytic constructions."
conflicts = ["It analyzes canonical (o)x forms as the standard aorist and root/old sigmatic forms as secondary/nonstandard, while UT uses the pedagogical asigmatic/sigmatic/new taxonomy; the matrix preserves each morphological formation and records the terminology crosswalk.", "§382.3 reports no attested OCS first-person dual dative clitic and compares later Church Slavonic на, whereas UT lists на in its OCS table; the engine marks that one variant disputed rather than silently choosing a source.", "Polivanova Table 434 assigns метати to the 3° мет-/метѫ group, whereas the official LOVe record supplies мещ-/метај- presents for its метати analysis; the reusable group profile follows Polivanova and the facade retains the two LOVe present profiles as competing lexical analyses, merging them only in cells with identical output.", "Table 434 visually crosses the displayed past stems of мрѣти and разскврѣти; the engine restores each root to its own lexeme under the table's uniform group distribution and records the correction instead of generating cross-lexeme forms.", "Across 23,149 safely aligned standard-noun cells, Polivanova's canonical profiles disagree with 1,626 Kaikki rank-zero forms, chiefly contracted versus expanded -ьj- spellings and lexical u-/consonant-stem analyses; exact dictionary cells keep precedence while reviewed source IDs expose the canonical OSD prediction."]
