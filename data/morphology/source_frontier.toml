impact = "Adds a completeness-oriented independent grammar and grammatical dictionaries; §§285 and 303–305 define the exhaustive long-only adjective inventory, while §§287–320, 375–380, and Paradigmatic Dictionary entry 343 define the regular, exceptional, and adjectival profiles allocated to the determiner and pronoun facades. §§70, 72, 285, 299, and 303–306 plus the OSD spreadsheet define the exact ten-member simple-ordinal lexicon, its nine hard profiles, the трет.ьj boundary, and productive short/long agreement. The OSD also directly allocates дъвои, обои, and трои to j-pronominal class 2/p and четворъ, седморъ, and десѧторъ to hard adjectival class 2/a, establishing both inflectional halves of the collective system, and independently lists the fractional noun lexemes полъ and десѧтина. §§321–322, 345–351, 373–374, and 383–384 independently define the unique three/four tables, both thousand identities over the productive feminine ja-stem profile, the feminine i-stem background of five through nine, and the attested mixed paradigm and variants of ten. §§318 and 381–382 define the four intrinsic personal/reflexive/anaphoric identities, their defective dimensions, grammar-table clitics, and conditioned prepositional allomorphs. Its comparative chapters establish the two principal parts, three syncopated cell families, four alien endings, productive new formation, and closed old inventory. Its aorist inventory established the independent main/singular subbundles and the distinct standard vowel, old s-, and old x-sigmatic contracts. Its imperfect terminal table and manuscript discussion establish explicit uncontracted, contracted, iotated, and present-platform analyses without treating source frequency as a global default. Its unique-verb profiles independently establish the suppletive copular series and the complete имѣти/хотѣти auxiliary paradigms used by analytic constructions."
