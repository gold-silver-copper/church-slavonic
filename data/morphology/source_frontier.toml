impact = "Defines the current OCS grammatical inventory and productive generalizations; its pronoun tables independently enumerate first and second person, the numberless reflexive, marked clitics, the defective gendered third-person anaphoric with prepositional n- forms, and relative иже formed with же. Its pronominal and interrogative-adjective chapters independently crosscheck the shared hard/soft/j-stem terminals and the exceptional кꙑи/чии profiles used by the determiner facade. Its numeral lesson defines singular agreement for one, dual agreement for two/both, plural agreement for three/four, genitive-plural government for five and higher simple cardinals, the component-inflection patterns of teens and multiplicative tens/hundreds/thousands, the hundred and thousand magnitude heads, the two 10,000 realizations, and additive и between nonzero decimal chunks. Lesson 8 §36 defines the productive verbal noun from a past-passive platform plus -ьj-, explicitly licenses the same formation for intransitives without an actual passive participle, and assigns the result to the complete soft-neuter jo-stem declension. It also crosschecks old/new comparator formation, identifies analytic rather than universally synthetic superlative strategies, licenses да plus present commands, and supplies the complete analytic tense, mood, future, and passive construction inventory."
conflicts = ["Its normalized lesson forms do not by themselves settle manuscript-specific contraction and orthographic variants.", "Lesson 8 §36 says tense ь before yod often, not invariably, realizes as и; the locked dictionary retains seventeen -ьѥ citations where the productive canonical profile has -иѥ, so exact spelling precedes productive realization.", "Its diachronic asigmatic/sigmatic/new presentation crosswalks to, but does not share labels with, Polivanova's canonical standard versus secondary old-aorist analysis.", "Its first-person table lists dual dative clitic на, whereas Polivanova §382.3 reports no attested OCS clitic in that cell and compares later Church Slavonic на; the engine retains the form with disputed evidence."]
