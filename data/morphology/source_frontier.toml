impact = "Independently lists полъ ‘half’ among the six secure masculine u-stem nouns and supplies that class's full singular, dual, and plural declension. It also states that hundredth and thousandth take -ьнъ, ordinals admit short and long adjective forms, teens use an inflected simple ordinal before invariant на десѧте, decades may use десѧтъ or десѧтьнъ, and compound ordinals follow cardinal composition principles. Its enumerated ordinal inventory ends at thousandth and supplies no stem or component-inflection rule for a higher magnitude. Section 115 calls both тъма and несъвѣда 10,000 but declines only тъма; the lexical monograph and manuscript studies below control the resulting semantic conflict."
conflicts = ["Its compact description does not enumerate every fused teen and magnitude stem or settle the component-inflection variants of asyndetic additive ordinals; the general cardinal-composition statement is insufficient to choose among historically different post-thousand ordinal formations.", "Its parenthetical assignment of exact 10,000 to несъвѣда conflicts with Lvov's manuscript-grounded distinction between тъма ‘ten thousand’ and несъвѣда ‘incalculable quantity’, as well as later studies of Кирик's million-scale use. The engine retains несъвѣда as an inflectable indefinite-quantity noun but excludes it from exact integer composition."]
