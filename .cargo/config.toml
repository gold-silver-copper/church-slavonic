# Verify facade packages before their matching core versions exist on
# crates.io. Cargo configuration is not embedded in the resulting .crate;
# actual releases still publish each core, facade, and dictionary in order.
[alias]
xtask = "run --package xtask --"
# The gold-gap inner loop runs the replay optimised: `cargo gold --check`,
# `cargo gold propose`, `cargo gold admit …`, `cargo gold loop …`.
gold = "run --release --package xtask -- synodal-gold"

