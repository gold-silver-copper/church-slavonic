name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Documentation tests
        run: cargo test --workspace --doc

  test-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace except Synodal dictionary
        run: cargo test --workspace --exclude synodal-church-slavonic-dictionary --all-targets --all-features

  test-synodal-dictionary-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Synodal dictionary library and binaries
        run: cargo test -p synodal-church-slavonic-dictionary --lib --bins --all-features

  test-synodal-dictionary-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Synodal dictionary CLI
        run: cargo test -p synodal-church-slavonic-dictionary --test cli --all-features

  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The wave-close suite is retired; its surviving closing checks run
      # individually. check-structure includes synodal-check and the gold
      # gate; the guard witnesses, lexical-union ledger, fixture bootstrap,
      # and immutable archive were the other CI-safe wave-close steps.
      - name: Structural checks
        run: cargo xtask check-structure
      - name: Synodal guard witnesses
        run: cargo xtask synodal-guard-witnesses
      - name: Synodal lexical union
        run: cargo xtask synodal-lexical-union --check
      - name: Synodal fixture bootstrap
        run: cargo xtask synodal-fixture-bootstrap
      - name: Immutable archive
        run: cargo xtask synodal-archive --check
      # Full-enumeration replay of both gold oracles from committed artifacts
      # only; witness consultation is a source-present-only refinement, so the
      # regenerated gap is identical with or without data/intermediate.
      - name: Synodal gold gate
        run: cargo xtask synodal-gold --check
      - name: Package and publish dry runs
        run: |
          cargo publish --dry-run --no-verify --allow-dirty -p church-slavonic-core
          cargo publish --dry-run --no-verify --allow-dirty -p church-slavonic-orthography
          cargo publish --dry-run --no-verify --allow-dirty -p church-slavonic
          cargo publish --dry-run --no-verify --allow-dirty -p church-slavonic-dictionary
          cargo publish --dry-run --no-verify --allow-dirty -p synodal-church-slavonic-core
          cargo publish --dry-run --no-verify --allow-dirty -p synodal-church-slavonic
          cargo publish --dry-run --no-verify --allow-dirty -p synodal-church-slavonic-dictionary
      - name: Generated tree stays clean
        run: git diff --exit-code

  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native no-default-feature builds
        run: |
          cargo check -p synodal-church-slavonic-core --no-default-features
          cargo check -p synodal-church-slavonic --no-default-features
          cargo check -p synodal-church-slavonic-dictionary --no-default-features
      - name: WebAssembly runtime builds
        run: |
          cargo check -p synodal-church-slavonic-core --target wasm32-unknown-unknown --no-default-features
          cargo check -p synodal-church-slavonic --target wasm32-unknown-unknown --no-default-features
          cargo check -p synodal-church-slavonic-dictionary --target wasm32-unknown-unknown --no-default-features
