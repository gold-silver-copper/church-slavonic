name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Documentation tests
        run: cargo test --workspace --doc

  test-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test workspace except Synodal dictionary
        run: cargo test --workspace --exclude synodal-church-slavonic-dictionary --all-targets --all-features

  test-synodal-dictionary-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Synodal dictionary library and binaries
        run: cargo test -p synodal-church-slavonic-dictionary --lib --bins --all-features

  test-synodal-dictionary-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Synodal dictionary CLI
        run: cargo test -p synodal-church-slavonic-dictionary --test cli --all-features

  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Deterministic fixture bootstrap
        run: cargo xtask synodal-fixture-bootstrap
      - name: Deterministic coverage fixture
        run: cargo xtask synodal-coverage --offline --fixture --check
      # The canonical coverage run needs the gitignored intermediate corpus, so
      # it cannot execute here. This enforces the sealed composition floors
      # against the committed report instead, which is what makes phase 1 and
      # phase 2 bite on a pull request rather than only on a manual dispatch.
      - name: Sealed coverage floors
        run: cargo xtask synodal-coverage-floors
      - name: Exploratory prediction gate
        run: cargo xtask synodal-predict --check
      - name: Structural checks
        run: |
          cargo xtask check-structure
          cargo xtask guard-witnesses
          cargo xtask synodal-check
          cargo xtask synodal-guard-witnesses
          cargo xtask synodal-marginal-recovery --check
          cargo xtask synodal-archive --check
      - name: Package and publish dry runs
        run: |
          cargo publish --dry-run --no-verify --allow-dirty -p synodal-church-slavonic-core
          cargo publish --dry-run --no-verify --allow-dirty -p synodal-church-slavonic
          cargo publish --dry-run --no-verify --allow-dirty -p synodal-church-slavonic-dictionary
      - name: Generated tree stays clean
        run: git diff --exit-code

  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Native no-default-feature builds
        run: |
          cargo check -p synodal-church-slavonic-core --no-default-features
          cargo check -p synodal-church-slavonic --no-default-features
          cargo check -p synodal-church-slavonic-dictionary --no-default-features
      - name: WebAssembly runtime builds
        run: |
          cargo check -p synodal-church-slavonic-core --target wasm32-unknown-unknown --no-default-features
          cargo check -p synodal-church-slavonic --target wasm32-unknown-unknown --no-default-features
          cargo check -p synodal-church-slavonic-dictionary --target wasm32-unknown-unknown --no-default-features
