[package]
name = "synodal-church-slavonic-core"
version = "0.4.0"
description = "Pure morphology and orthography primitives for Synodal Russian Church Slavonic"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["Cargo.toml", "README.md", "ATTRIBUTION.md", "LICENSE-*", "src/**"]

[features]
default = ["serde"]
serde = ["dep:serde", "church-slavonic-core/serde", "church-slavonic-orthography/serde"]

[dependencies]
church-slavonic-core.workspace = true
church-slavonic-orthography.workspace = true
serde = { workspace = true, optional = true }
unicode-normalization.workspace = true

[lints]
workspace = true
