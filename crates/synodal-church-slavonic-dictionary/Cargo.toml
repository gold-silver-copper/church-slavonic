[package]
name = "synodal-church-slavonic-dictionary"
version = "0.5.0"
description = "Semantic lookup and morphological analysis for Synodal Russian Church Slavonic"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = [
    "Cargo.toml",
    "README.md",
    "ATTRIBUTION.md",
    "LICENSE-*",
    "examples/**",
    "generated/**",
    "src/**",
]

[features]
default = ["serde", "cli"]
serde = ["synodal-church-slavonic/serde", "synodal-church-slavonic-core/serde"]
cli = ["dep:serde_json"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, optional = true }
synodal-church-slavonic.workspace = true
synodal-church-slavonic-core.workspace = true
unicode-normalization.workspace = true

[[bin]]
name = "synodal-dict"
path = "src/bin/synodal-dict.rs"
required-features = ["cli"]

[lints]
workspace = true
