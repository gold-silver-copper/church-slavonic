[package]
name = "synodal-church-slavonic"
version = "0.6.0"
description = "Dictionary-backed inflection for Synodal Russian Church Slavonic"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
include = ["Cargo.toml", "build.rs", "README.md", "ATTRIBUTION.md", "LICENSE-*", "generated/**", "src/**"]

[features]
default = ["serde"]
serde = ["dep:serde", "synodal-church-slavonic-core/serde"]

[dependencies]
serde = { workspace = true, optional = true }
synodal-church-slavonic-core.workspace = true
unicode-normalization.workspace = true

[lints]
workspace = true
