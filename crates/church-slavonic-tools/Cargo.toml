[package]
name = "church-slavonic-tools"
version = "0.1.0"
description = "Import, evaluation and treebank tooling for the church-slavonic lexicon (cargo xtask)"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
church-slavonic = { workspace = true, features = ["ocs"] }
church-slavonic-tagger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-normalization = { workspace = true }
sha2 = "0.10.9"
tar = "0.4.46"
flate2 = "1.1.10"
tempfile = "3.27.0"
quick-xml = "0.41.0"

[lints]
workspace = true
